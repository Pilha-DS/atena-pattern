[project]
name = "atena-app"
version = "0.1.0"
description = "API do projeto"
requires-python = ">=3.12"
dependencies = [
    "atena-pattern",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

# O núcleo do padrão mora no mesmo repositório: editar packages/atena_pattern
# reflete aqui sem reinstalar.
[tool.uv.sources]
atena-pattern = { path = "../../packages/atena_pattern", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
